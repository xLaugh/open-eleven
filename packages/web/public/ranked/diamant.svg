  <path d="M 256 56 A 200 200 0 1 1 255.9 56 Z" fill="none" stroke="var(--tr-edge)" stroke-width="5.61" transform="translate(256,256) scale(0.7125) translate(-256,-256)"/>
  <path d="M 256 56 A 200 200 0 1 1 255.9 56 Z" fill="none" stroke="var(--tr-acc)" stroke-width="4.02" transform="translate(256,256) scale(0.6965) translate(-256,-256)"/>
  <path d="M 256 56 A 200 200 0 1 1 255.9 56 Z" fill="none" stroke="var(--tr-edge)" stroke-width="5.95" transform="translate(256,256) scale(0.6725) translate(-256,-256)"/>
  <path d="M 256 56 A 200 200 0 1 1 255.9 56 Z" fill="none" stroke="var(--tr-acc)" stroke-width="4.27" transform="translate(256,256) scale(0.6565) translate(-256,-256)"/>

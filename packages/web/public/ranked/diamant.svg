</linearGradient>
<linearGradient id="tr-corps" x1="0" y1="0" x2=".2" y2="1">
  <stop offset="0" stop-color="var(--tr-c1)"/>
  <stop offset=".55" stop-color="var(--tr-c2)"/>
  <stop offset="1" stop-color="var(--tr-c3)"/>
</linearGradient>
<linearGradient id="tr-band" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="var(--tr-l2)"/>
  <stop offset=".5" stop-color="var(--tr-l4)"/>
  <stop offset="1" stop-color="var(--tr-l5)"/>
</linearGradient>
<radialGradient id="tr-spec" cx=".33" cy=".22" r=".62">
  <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
  <stop offset=".45" stop-color="#fff" stop-opacity=".22"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="tr-vol" cx=".72" cy=".85" r=".6">

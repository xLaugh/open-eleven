  <path d="M 256 56 A 200 200 0 1 1 255.9 56 Z" fill="none" stroke="var(--tr-acc)" stroke-width="9.44" stroke-linecap="round" stroke-dasharray="0.01 24.17" transform="translate(256,256) scale(0.8475) translate(-256,-256)"/>
</g>

<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg" role="img" class="tier-epique">
<style>
  .tier-epique {
    --tr-l1:#e6d0fb;
    --tr-l2:#c49bf2;
    --tr-l3:#9769d9;
    --tr-l4:#5f3797;
    --tr-l5:#ae81e7;
    --tr-l6:#d7bbf8;
    --tr-c1:#4b217a;
    --tr-c2:#321552;
    --tr-c3:#1d0c2f;
    --tr-acc:#CFAAF5;
    --tr-edge:#140620;
    --tr-slot:#080310;
    --tr-shade:rgba(0,0,0,.52);
    --tr-stitch:rgba(207,170,245,.22);
    --tr-deboss:#4F2380;
    --tr-panneau:#5f3797;
    --tr-guilloche:#C79FF3;
    --tr-rays-a:0;
    --tr-mol-a:0;
    --tr-eclat-a:0;
    --tr-halo:#9B5CE6;
    --tr-halo-a:0;
    --tr-aura-a:0;
    --tr-facettes:0;
    --tr-filet:0.761;
    --tr-grenetis:0.718;
    --tr-vagues:0.34;
    --tr-listel:0;
    --tr-chanfrein:0.312;
    --tr-creux:0.42;
    --tr-sheen:0.28;

<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg" role="img" class="tier-legendaire">
<style>
  .tier-legendaire {
    --tr-l1:#ffe0af;
    --tr-l2:#ffb24d;
    --tr-l3:#f1741f;
    --tr-l4:#98380a;
    --tr-l5:#ff9833;
    --tr-l6:#ffcd8a;
    --tr-c1:#772808;
    --tr-c2:#4a1604;
    --tr-c3:#260b02;
    --tr-acc:#FFC271;
